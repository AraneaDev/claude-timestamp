name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
      - 'test/**'
      - 'tests/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '.github/**'
  # release-please only ever runs on a push to main, so a release PR that goes
  # stale, or a run that failed, has no way back without a new commit. This
  # gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Opens and keeps a Release PR up to date from the conventional commits on
      # main. Merging that PR creates the vX.Y.Z tag and the GitHub Release,
      # and sets release_created=true.
      #
      # RELEASE_PLEASE_TOKEN is used when it exists. GitHub does not start
      # workflows for events raised by the built-in GITHUB_TOKEN, so a Release
      # PR opened with it arrives with no checks on it, and main requires those
      # checks before anything can be merged. A personal access token raises
      # the event as a real account, so CI runs on the Release PR by itself.
      #
      # Without the secret this still works; the Release PR then has to be
      # closed and reopened once to start its checks. See CONTRIBUTING.md.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the merge that cut a release. The tag is
      # made with GITHUB_TOKEN, so no tag-triggered workflow would fire; the
      # verification lives here instead. There is nothing to publish, so this
      # checks that what was just released actually works.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Install jq
        if: ${{ steps.release.outputs.release_created }}
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: bash tests/run.sh

      - name: Check the docs against the code
        if: ${{ steps.release.outputs.release_created }}
        run: bash tools/check-docs.sh

      - name: The released version is the one in the manifests
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          claude_version="$(jq -r .version .claude-plugin/plugin.json)"
          codex_version="$(jq -r .version .codex-plugin/plugin.json)"
          portable_version="$(jq -r .version plugin.json)"
          echo "tag: $TAG   Claude: $claude_version   Codex: $codex_version   universal: $portable_version"
          [ "$TAG" = "v${claude_version}" ]
          [ "$claude_version" = "$codex_version" ]
          [ "$claude_version" = "$portable_version" ]
