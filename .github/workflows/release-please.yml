name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    steps:
      # Opens and keeps a Release PR up to date from the conventional commits on
      # main. Merging that PR creates the vX.Y.Z tag and the GitHub Release,
      # and sets release_created=true.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the merge that cut a release. The tag is
      # made with GITHUB_TOKEN, so no tag-triggered workflow would fire; the
      # verification lives here instead. There is nothing to publish, so this
      # checks that what was just released actually works.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Install jq
        if: ${{ steps.release.outputs.release_created }}
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: bash tests/run.sh

      - name: Check the docs against the code
        if: ${{ steps.release.outputs.release_created }}
        run: bash tools/check-docs.sh

      - name: The released version is the one in the manifests
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          echo "tag: $TAG   plugin.json: $version"
          [ "$TAG" = "v${version}" ]
