name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# None of the jobs below push a commit, write a tag, or call an API that
# needs more than read access, and pr-title runs a pull request's own code
# against whatever token this workflow holds. A single read-only grant here
# covers every job, present and future, instead of five copies of the same
# line that a new job can be added without.
permissions:
  contents: read

jobs:
  test:
    # Every supported platform runs the suite, because the differences are real:
    # BSD date (macOS) rejects some GNU format flags, and Git Bash (Windows)
    # ships without a zoneinfo database.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell; the plugin is bash throughout,
        # and on Windows that means Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install jq
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq $(jq --version) already present"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install jq
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install jq -y
          else
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Report the platform's date and timezone support
        # Recorded on every run because these two facts drive most of what can
        # differ between platforms here.
        run: |
          echo "uname:      $(uname -s)"
          echo "date:       $(date --version 2>/dev/null | head -1 || echo 'BSD/other date')"
          echo "zoneinfo:   $([ -d /usr/share/zoneinfo ] && echo present || echo ABSENT)"
          echo "TZ=Asia/Tokyo -> $(TZ=Asia/Tokyo date '+%H:%M %Z')"
          echo "TZ=UTC        -> $(TZ=UTC date '+%H:%M %Z')"

      - name: Run tests
        run: bash tests/run.sh

      - name: Run tests under bash 3.2
        # macOS still ships bash 3.2 as /bin/bash. The plugin claims to work
        # there, and this is the only runner that can actually check it, so the
        # claim gets tested rather than asserted.
        if: runner.os == 'macOS'
        run: |
          echo "/bin/bash is $(/bin/bash --version | head -1)"
          /bin/bash tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure shellcheck is available
        # The Ubuntu runner image already ships shellcheck, so the usual
        # apt-get update && install was pure latency. The fallback fetches the
        # upstream static binary, which is still far quicker than apt.
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "using preinstalled $(shellcheck --version | grep version:)"
            exit 0
          fi
          version=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${version}/shellcheck"
          shellcheck --version | grep version:

      - name: Syntax check
        run: |
          for f in hooks/scripts/*.sh hooks/scripts/lib/*.sh tests/run.sh \
                   tools/*.sh tools/screenshots/*.sh \
                   .githooks/pre-push .githooks/pre-commit .githooks/commit-msg; do
            bash -n "$f"
          done

      - name: Python syntax check
        # screenshots.py is developer tooling and never runs for a user, so it
        # gets a syntax check rather than a linter: it adds no dependency and
        # still stops a script that cannot be imported from shipping. It does
        # not check anything semantic, and is not meant to.
        run: python3 -m compileall -q tools/screenshots/screenshots.py

      - name: shellcheck
        # SC1091 is excluded because every hook resolves its library path at
        # runtime, which shellcheck cannot follow statically.
        #
        # Three optional checks are on because they cost nothing here. The
        # others were measured against this same file set and rejected, with
        # the finding counts recorded so the decision stays legible rather
        # than looking like an oversight:
        #
        #   require-variable-braces      781  fights the house style
        #   check-extra-masked-returns   362  noisy against the || return idiom
        #   require-double-brackets      240  [ ] is a bash 3.2 discipline
        #   check-unassigned-uppercase    81  the CT_* public interface
        #   add-default-case              51  render paths deliberately have none
        #
        # No optional check catches an assignment whose failure exits the
        # script under set -e, which is what broke detect_tz on older macOS.
        # Do not assume linting covers that.
        run: |
          shellcheck -S style -e SC1091 \
            --enable=deprecate-which \
            --enable=avoid-nullary-conditions \
            --enable=quote-safe-variables \
            hooks/scripts/*.sh \
            hooks/scripts/lib/*.sh \
            tests/run.sh \
            tools/check-docs.sh \
            tools/check-commit-title.sh \
            tools/screenshots/make.sh \
            .githooks/pre-push .githooks/pre-commit .githooks/commit-msg

  pr-title:
    # Pull requests are merged by squash, so the PR title becomes the commit
    # subject on main, and that subject is what release-please reads to work
    # out the next version. A title outside Conventional Commits produces a
    # commit release-please silently ignores, and the release never happens.
    # There is no title to check on a push or a manual run, only on a pull
    # request, hence the guard below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Check the PR title follows Conventional Commits
        # The title comes through an environment variable rather than being
        # interpolated into the script directly: it is attacker-controlled on
        # a fork PR, and a title carrying quotes or backticks must not be able
        # to break out of the shell command that checks it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/check-commit-title.sh "$PR_TITLE"

  docs:
    # The README goes stale silently: a setting gets added and never written
    # down, a count stops matching, an image gets renamed. All cheap to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Check the README against the code
        run: bash tools/check-docs.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate JSON
        run: |
          for f in .claude-plugin/plugin.json hooks/hooks.json; do
            jq -e . "$f" > /dev/null && echo "$f ok"
          done

      - name: Hook commands point at files that exist
        # Guards the failure mode a rename introduces: hooks.json still parses
        # but names a script that is no longer there, and the plugin silently
        # does nothing.
        run: |
          status=0
          while read -r script; do
            path="${script#\$CLAUDE_PLUGIN_ROOT/}"
            if [ -f "$path" ]; then
              echo "ok   $path"
            else
              echo "MISSING $path"
              status=1
            fi
          done < <(jq -r '.hooks[][].hooks[].command | scan("\\$CLAUDE_PLUGIN_ROOT/[^\"]+")' hooks/hooks.json)
          exit $status
